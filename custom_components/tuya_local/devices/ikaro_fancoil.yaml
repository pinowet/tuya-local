name: Fan coil
products:
  - id: i87zmqf7dckzhhj1
    manufacturer: Ideal Clima
    model: Ikaro
entities:
  - entity: climate
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: hot
                value: heat
              - dps_val: cold
                value: cool
              - dps_val: dehu
                value: dry
              - dps_val: fan
                value: fan_only
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 8
          max: 32
      - id: 3
        type: integer
        name: current_temperature
        unit: C
      - id: 4
        type: string
        name: mode
        hidden: true
      - id: 5
        type: string
        name: fan_mode
  - entity: sensor
    name: Water temperature
    class: temperature
    dps:
      - id: 101
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: binary_sensor
    name: Water temperature unsuitable
    class: problem
    category: diagnostic
    dps:
      - id: 102
        type: boolean
        name: sensor
  - entity: sensor
    name: Maximum cooling water temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 103
        type: integer
        name: sensor
        unit: C
  - entity: sensor
    name: Minimum heating water temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 104
        type: integer
        name: sensor
        unit: C
